name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A venv, not --system: the runner's system Python is externally managed
      # (PEP 668) and refuses the install. setup-uv already provisions a venv on
      # some runners, so --allow-existing keeps this working either way.
      - name: Install
        run: |
          uv venv --allow-existing
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Test
        # The suite runs entirely against a fake Ollama fixture -- no GPU, no
        # models, no network.
        run: uv run pytest -q
